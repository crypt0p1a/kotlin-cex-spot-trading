[workspace]
resolver = "3"
members = [
  "kotlin-cex-spot-trading-rust",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/crypt0p1a/kotlin-cex-spot-trading"

[workspace.dependencies]
base64 = "0.22.1"
hmac = "0.12.1"
# rustls on ring: cross-compiles for Android and iOS without the cmake of aws-lc-rs
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio = { version = "1", default-features = false }
uniffi = "=0.32.0"
